        { season: 5, episode: 3, url: "https://s1.lomont.site/vod/films/breaking_bad.s05e03.dub.bluray.1080p.hevc_339622/hls/index.m3u8", titleRu: "Опасные условия", titleEn: "Hazard Pay", seasonName: "5 СЕЗОН" },
        { season: 5, episode: 4, url: "https://s1.lomont.site/vod/films/breaking_bad.s05e04.dub.bluray.1080p.hevc_339623/hls/index.m3u8", titleRu: "Пятьдесят один", titleEn: "Fifty-One", seasonName: "5 СЕЗОН" },
        { season: 5, episode: 5, url: "https://s1.lomont.site/vod/films/breaking_bad.s05e05.dub.bluray.1080p.hevc_339624/hls/index.m3u8", titleRu: "Мёртвый груз", titleEn: "Dead Freight", seasonName: "5 СЕЗОН" },
        { season: 5, episode: 6, url: "https://s1.lomont.site/vod/films/breaking_bad.s05e06.dub.bluray.1080p.hevc_339625/hls/index.m3u8", titleRu: "Покупай по-крупному", titleEn: "Buyout", seasonName: "5 СЕЗОН" },
        { season: 5, episode: 7, url: "https://s1.lomont.site/vod/films/breaking_bad.s05e07.dub.bluray.1080p.hevc_339626/hls/index.m3u8", titleRu: "Скажи моему имени", titleEn: "Say My Name", seasonName: "5 СЕЗОН" },
        { season: 5, episode: 8, url: "https://s1.lomont.site/vod/films/breaking_bad.s05e08.dub.bluray.1080p.hevc_339627/hls/index.m3u8", titleRu: "Лети", titleEn: "Gliding Over All", seasonName: "5 СЕЗОН" },
        { season: 5, episode: 9, url: "https://s1.lomont.site/vod/films/breaking_bad.s05e09.dub.bluray.1080p.hevc_339628/hls/index.m3u8", titleRu: "Кровавые деньги", titleEn: "Blood Money", seasonName: "5 СЕЗОН" },
        { season: 5, episode: 10, url: "https://s1.lomont.site/vod/films/breaking_bad.s05e10.dub.bluray.1080p.hevc_339629/hls/index.m3u8", titleRu: "Погребённый", titleEn: "Buried", seasonName: "5 СЕЗОН" },
        { season: 5, episode: 11, url: "https://s1.lomont.site/vod/films/breaking_bad.s05e11.dub.bluray.1080p.hevc_339630/hls/index.m3u8", titleRu: "Конфиденциальные материалы", titleEn: "Confessions", seasonName: "5 СЕЗОН" },
        { season: 5, episode: 12, url: "https://s1.lomont.site/vod/films/breaking_bad.s05e12.dub.bluray.1080p.hevc_339631/hls/index.m3u8", titleRu: "Шершень", titleEn: "Rabid Dog", seasonName: "5 СЕЗОН" },
        { season: 5, episode: 13, url: "https://s1.lomont.site/vod/films/breaking_bad.s05e13.dub.bluray.1080p.hevc_339632/hls/index.m3u8", titleRu: "Тохаджилли", titleEn: "To'hajiilee", seasonName: "5 СЕЗОН" },
        { season: 5, episode: 14, url: "https://s1.lomont.site/vod/films/breaking_bad.s05e14.dub.bluray.1080p.hevc_339633/hls/index.m3u8", titleRu: "Озимандия", titleEn: "Ozymandias", seasonName: "5 СЕЗОН" },
        { season: 5, episode: 15, url: "https://s1.lomont.site/vod/films/breaking_bad.s05e15.dub.bluray.1080p.hevc_339634/hls/index.m3u8", titleRu: "Денежный поезд", titleEn: "Granite State", seasonName: "5 СЕЗОН" },
        { season: 5, episode: 16, url: "https://s1.lomont.site/vod/films/breaking_bad.s05e16.dub.bluray.1080p.hevc_339635/hls/index.m3u8", titleRu: "Фелина", titleEn: "Felina", seasonName: "5 СЕЗОН" }
    ];

    // DOM элементы
    const video = document.getElementById('videoPlayer');
    const currentLabelSpan = document.getElementById('currentEpisodeLabel');
    const playlistContainer = document.getElementById('playlistContainer');
    const loadingDiv = document.getElementById('loadingIndicator');
    const autoplayCheckbox = document.getElementById('autoplayCheckbox');

    let hls = null;
    let currentActiveBtn = null;
    let currentEpisodeIndex = null;
    let autoplayEnabled = false;

    function loadEpisode(episode, btnElement) {
        if (!episode || !episode.url) {
            currentLabelSpan.innerText = `❌ Ошибка: ссылка не найдена`;
            loadingDiv.style.display = 'none';
            return;
        }
        loadingDiv.style.display = 'flex';
        
        if (hls) {
            hls.destroy();
            hls = null;
        }
        
        if (currentActiveBtn) {
            currentActiveBtn.classList.remove('active-ep');
        }
        if (btnElement) {
            btnElement.classList.add('active-ep');
            currentActiveBtn = btnElement;
        }
        
        const foundIndex = episodesData.findIndex(e => e.url === episode.url);
        if (foundIndex !== -1) currentEpisodeIndex = foundIndex;
        
        // Исправленный вывод: без дубля "серия 1 — Серия 1: ..."
        let displayText = `${episode.seasonName} • ${episode.episode} серия — ${episode.titleRu}`;
        currentLabelSpan.innerText = displayText;
        
        const url = episode.url;
        
        if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            const onLoaded = () => {
                loadingDiv.style.display = 'none';
                video.play().catch(e => console.warn("autoplay blocked", e));
                video.removeEventListener('loadedmetadata', onLoaded);
            };
            video.addEventListener('loadedmetadata', onLoaded, { once: true });
            video.addEventListener('error', () => {
                loadingDiv.style.display = 'none';
                currentLabelSpan.innerText = `${displayText} (ошибка воспроизведения)`;
            }, { once: true });
            video.load();
        } else if (Hls.isSupported()) {
            hls = new Hls({ debug: false, enableWorker: true, lowLatencyMode: false });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                loadingDiv.style.display = 'none';
                video.play().catch(e => console.log("autoplay заблокирован", e));
            });
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    console.error("Fatal HLS error", data);
                    loadingDiv.style.display = 'none';
                    currentLabelSpan.innerText = `${displayText} (ошибка потока)`;
                    if (hls) hls.destroy();
                } else {
                    loadingDiv.style.display = 'none';
                }
            });
        } else {
            loadingDiv.style.display = 'none';
            alert("Ваш браузер не поддерживает HLS-потоки.");
            currentLabelSpan.innerText = `${displayText} (не поддерживается)`;
        }
        
        setTimeout(() => {
            if (loadingDiv.style.display === 'flex') {
                loadingDiv.style.display = 'none';
                if (currentLabelSpan.innerText.includes(episode.titleRu))
                    currentLabelSpan.innerText = `${displayText} (долгая загрузка)`;
            }
        }, 12000);
    }

    function playNextEpisode() {
        if (!autoplayEnabled) return;
        if (currentEpisodeIndex === null) return;
        const nextIndex = currentEpisodeIndex + 1;
        if (nextIndex >= episodesData.length) {
            console.log("Конец всех сезонов Breaking Bad.");
            return;
        }
        const nextEpisode = episodesData[nextIndex];
        const nextButton = document.querySelector(`.playlist-ep-btn[data-idx="${nextIndex}"]`);
        if (nextButton) {
            loadEpisode(nextEpisode, nextButton);
        } else {
            loadEpisode(nextEpisode, null);
        }
    }
    
    video.addEventListener('ended', () => { playNextEpisode(); });
    autoplayCheckbox.addEventListener('change', (e) => { autoplayEnabled = e.target.checked; });

    function buildPlaylist() {
        const groups = new Map();
        episodesData.forEach((ep, idx) => {
            const key = ep.seasonName;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push({ ...ep, originalIndex: idx });
        });
        
        const order = ["1 СЕЗОН", "2 СЕЗОН", "3 СЕЗОН", "4 СЕЗОН", "5 СЕЗОН"];
        
        for (let seasonName of order) {
            const eps = groups.get(seasonName);
            if (!eps) continue;
            const seasonDiv = document.createElement('div');
            seasonDiv.className = `playlist-season`;
            seasonDiv.innerHTML = `<div class="playlist-season-title">${seasonName}</div><div class="playlist-episodes" id="playlist-season-${seasonName.replace(/\s/g, '')}"></div>`;
            playlistContainer.appendChild(seasonDiv);
            const episodesContainer = seasonDiv.querySelector('.playlist-episodes');
            
            eps.forEach(ep => {
                const btn = document.createElement('button');
                btn.className = 'playlist-ep-btn';
                btn.setAttribute('data-season', ep.season);
                btn.setAttribute('data-episode', ep.episode);
                btn.setAttribute('data-idx', ep.originalIndex);
                // В плейлисте тоже убрали дубль: "1 серия — Пилот"
                const title = `${ep.episode} серия — ${ep.titleRu}`;
                btn.innerHTML = `<div class="episode-ru">${title}</div><div class="episode-en">${ep.titleEn}</div>`;
                btn.addEventListener('click', () => loadEpisode(ep, btn));
                episodesContainer.appendChild(btn);
            });
        }
        
        if (episodesData.length) {
            const firstEp = episodesData[0];
            const firstBtn = document.querySelector(`.playlist-ep-btn[data-idx="0"]`);
            if (firstBtn) loadEpisode(firstEp, firstBtn);
            else loadEpisode(firstEp, null);
        }
    }
    
    buildPlaylist();
    
    video.addEventListener('error', () => { loadingDiv.style.display = 'none'; });
    video.addEventListener('playing', () => { loadingDiv.style.display = 'none'; });
    video.addEventListener('waiting', () => { if (!video.paused) loadingDiv.style.display = 'flex'; });
    video.addEventListener('canplay', () => { loadingDiv.style.display = 'none'; });
    video.addEventListener('stalled', () => { loadingDiv.style.display = 'flex'; });
</script>
