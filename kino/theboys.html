<!DOCTYPE html>
<html lang="ru">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0a0c12 0%, #12151e 100%);
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            color: #f0f3fa;
            padding: 1.5rem;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #e6a017, #ffcc44);

            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }
        .header p {
            color: #a0a9c0;
            font-size: 0.9rem;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 1.5rem;
            align-items: start;
        }

        .player-column {
            position: sticky;
            top: 1.5rem;
        }

        .player-section {
            background: #0b0e16;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 12px 28px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .video-wrapper {
            position: relative;
            background: #000;
            width: 100%;
        }
        video {
            width: 100%;
            display: block;
            aspect-ratio: 16 / 9;
            background-color: #000;
            outline: none;
        }
        .episode-info {
            padding: 0.8rem 1.2rem;
            background: #0f121c;
            border-top: 1px solid #232837;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .now-playing {
            font-weight: 600;
            background: #1e243b;
            padding: 0.3rem 0.9rem;
            border-radius: 40px;
            font-size: 0.85rem;
        }
        .now-playing span {
            color: #ffaa33;
            margin-right: 6px;
        }
        .controls-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .quality-badge {
            font-size: 0.7rem;
            background: #2a2f44;
            padding: 0.2rem 0.7rem;
            border-radius: 50px;
        }
        .autoplay-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            background: #1a1e2f;
            padding: 0.2rem 0.8rem 0.2rem 1rem;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
        }
        .autoplay-toggle:hover {
            background: #2a2f44;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #3a3f5e;
            transition: 0.3s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 15px;
            width: 15px;
            left: 3px;
            bottom: 2.5px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #e6a017;
        }
        input:checked + .slider:before {
            transform: translateX(19px);
        }
        .toggle-label {
            font-weight: 500;
        }

        .playlist-column {
            background: rgba(18, 22, 32, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 120px);
            position: sticky;
            top: 1.5rem;
        }
        .playlist-header {
            padding: 1rem 1.2rem;
            background: #0f121c;
            border-bottom: 1px solid #232837;
            font-weight: 700;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .playlist-scroll {
            overflow-y: auto;
            flex: 1;
            padding: 0.5rem 0.8rem 1rem;
        }
        .playlist-season {
            margin-bottom: 1.2rem;
        }
        .playlist-season-title {
            font-size: 0.85rem;
            font-weight: 600;
            background: #1e243b;
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            margin: 0.5rem 0 0.6rem 0;
            letter-spacing: 0.5px;
        }
        .playlist-episodes {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .playlist-ep-btn {
            background: #1b1f30;
            border: none;
            color: #eef3ff;
            padding: 0.6rem 0.8rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .playlist-ep-btn:hover {

            color: #0f121c;

            color: #0f121c;
        }

</head>

        { season: 4, episode: 3, url: "https://s5.lomont.site/content/stream/films/the.boys.s04e03.tvshows_684967/hls/1080/index.m3u8", titleRu: "Мы будем держать красный флаг здесь", titleEn: "We'll Keep the Red Flag Flying Here", seasonName: "4 СЕЗОН" },
        { season: 4, episode: 4, url: "https://s5.lomont.site/content/stream/films/the.boys.tvshows.s04e04.1080_689614/hls/1080/index.m3u8", titleRu: "Мудрость веков", titleEn: "Wisdom of the Ages", seasonName: "4 СЕЗОН" },
        { season: 4, episode: 5, url: "https://s5.lomont.site/content/stream/films/the.boys.tvshows.s04e05.1080_691479/hls/1080/index.m3u8", titleRu: "Берегись Бармаглота, сын мой", titleEn: "Beware the Jabberwock, My Son", seasonName: "4 СЕЗОН" },
        { season: 4, episode: 6, url: "https://s5.lomont.site/content/stream/films/the.boys.tvshows.s04.e06_709745/hls/1080/index.m3u8", titleRu: "Грязные дела", titleEn: "Dirty Business", seasonName: "4 СЕЗОН" },

        { season: 4, episode: 8, url: "https://s5.lomont.site/content/stream/films/the.boys.tvshows.s04e08.1080_724539/hls/1080/index.m3u8", titleRu: "Покушение на убийство", titleEn: "Assassination Run", seasonName: "4 СЕЗОН" },

        // ========== ТРЕЙЛЕРЫ 5 СЕЗОНА ==========
        { season: 5, episode: 0, url: "https://s8.opravar.online/content/stream/films/the_boys.trel.rhs_1186064/hls/720/index.m3u8", titleRu: "Трейлер 5 сезона (тизер)", titleEn: "Season 5 Trailer (Teaser)", seasonName: "ТРЕЙЛЕРЫ 5 СЕЗОНА" },
        { season: 5, episode: 1, url: "https://s1.opravar.online/content/stream/films/the_boys__final_season_trailer_kvk_1742268/hls/1080/index.m3u8", titleRu: "Финальный трейлер 5 сезона", titleEn: "Final Season 5 Trailer", seasonName: "ТРЕЙЛЕРЫ 5 СЕЗОНА" }
    ];

    // DOM элементы
    const video = document.getElementById('videoPlayer');
    const currentLabelSpan = document.getElementById('currentEpisodeLabel');
    const playlistContainer = document.getElementById('playlistContainer');
    const loadingDiv = document.getElementById('loadingIndicator');
    const autoplayCheckbox = document.getElementById('autoplayCheckbox');

    let hls = null;
    let currentActiveBtn = null;
    let currentEpisodeIndex = null;
    let autoplayEnabled = false;

    // Функция загрузки эпизода
    function loadEpisode(episode, btnElement) {
        if (!episode || !episode.url) {
            currentLabelSpan.innerText = `❌ Ошибка: ссылка не найдена`;
            loadingDiv.style.display = 'none';
            return;
        }
        loadingDiv.style.display = 'flex';
        
        if (hls) {
            hls.destroy();
            hls = null;
        }
        
        if (currentActiveBtn) {
            currentActiveBtn.classList.remove('active-ep');
        }
        if (btnElement) {
            btnElement.classList.add('active-ep');
            currentActiveBtn = btnElement;
        }
        
        const foundIndex = episodesData.findIndex(e => e.url === episode.url);
        if (foundIndex !== -1) currentEpisodeIndex = foundIndex;
        
        let displayText = `${episode.seasonName} • ${episode.episode > 0 ? episode.episode + ' серия — ' : ''}${episode.titleRu}`;
        if (episode.seasonName === "СПЕЦВЫПУСК") displayText = `СПЕЦВЫПУСК • ${episode.titleRu}`;
        if (episode.seasonName === "ТРЕЙЛЕРЫ 5 СЕЗОНА") displayText = `ТРЕЙЛЕР • ${episode.titleRu}`;
        currentLabelSpan.innerText = displayText;
        
        const url = episode.url;
        
        if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            const onLoaded = () => {
                loadingDiv.style.display = 'none';
                video.play().catch(e => console.warn("autoplay blocked", e));
                video.removeEventListener('loadedmetadata', onLoaded);
            };
            video.addEventListener('loadedmetadata', onLoaded, { once: true });
            video.addEventListener('error', () => {
                loadingDiv.style.display = 'none';
                currentLabelSpan.innerText = `${displayText} (ошибка воспроизведения)`;
            }, { once: true });
            video.load();
        } else if (Hls.isSupported()) {
            hls = new Hls({ debug: false, enableWorker: true, lowLatencyMode: false });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                loadingDiv.style.display = 'none';
                video.play().catch(e => console.log("autoplay заблокирован", e));
            });
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    console.error("Fatal HLS error", data);
                    loadingDiv.style.display = 'none';
                    currentLabelSpan.innerText = `${displayText} (ошибка потока)`;
                    if (hls) hls.destroy();
                } else {
                    loadingDiv.style.display = 'none';
                }
            });
        } else {
            loadingDiv.style.display = 'none';
            alert("Ваш браузер не поддерживает HLS-потоки.");
            currentLabelSpan.innerText = `${displayText} (не поддерживается)`;
        }
        
        setTimeout(() => {
            if (loadingDiv.style.display === 'flex') {
                loadingDiv.style.display = 'none';
                if (currentLabelSpan.innerText.includes(episode.titleRu))
                    currentLabelSpan.innerText = `${displayText} (долгая загрузка)`;
            }
        }, 12000);
    }

    function playNextEpisode() {
        if (!autoplayEnabled) return;
        if (currentEpisodeIndex === null) return;
        const nextIndex = currentEpisodeIndex + 1;
        if (nextIndex >= episodesData.length) {
            console.log("Конец всех сезонов The Boys.");
            return;
        }
        const nextEpisode = episodesData[nextIndex];
        const nextButton = document.querySelector(`.playlist-ep-btn[data-idx="${nextIndex}"]`);
        if (nextButton) {
            loadEpisode(nextEpisode, nextButton);
        } else {
            loadEpisode(nextEpisode, null);
        }
    }
    
    video.addEventListener('ended', () => { playNextEpisode(); });
    autoplayCheckbox.addEventListener('change', (e) => { autoplayEnabled = e.target.checked; });

    function buildPlaylist() {
        const groups = new Map();
        episodesData.forEach((ep, idx) => {
            const key = ep.seasonName;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push({ ...ep, originalIndex: idx });
        });
        
        const order = ["1 СЕЗОН", "СПЕЦВЫПУСК", "2 СЕЗОН", "3 СЕЗОН", "4 СЕЗОН", "ТРЕЙЛЕРЫ 5 СЕЗОНА"];
        
        for (let seasonName of order) {
            const eps = groups.get(seasonName);
            if (!eps) continue;
            const seasonDiv = document.createElement('div');
            seasonDiv.className = `playlist-season`;
            seasonDiv.innerHTML = `<div class="playlist-season-title">${seasonName}</div><div class="playlist-episodes" id="playlist-season-${seasonName.replace(/\s/g, '')}"></div>`;
            playlistContainer.appendChild(seasonDiv);
            const episodesContainer = seasonDiv.querySelector('.playlist-episodes');
            
            eps.forEach(ep => {
                const btn = document.createElement('button');
                btn.className = 'playlist-ep-btn';
                btn.setAttribute('data-season', ep.season);
                btn.setAttribute('data-episode', ep.episode);
                btn.setAttribute('data-idx', ep.originalIndex);
                let title = `${ep.episode > 0 ? ep.episode + ' серия — ' : ''}${ep.titleRu}`;
                if (ep.seasonName === "СПЕЦВЫПУСК") title = ep.titleRu;
                if (ep.seasonName === "ТРЕЙЛЕРЫ 5 СЕЗОНА") title = ep.titleRu;
                btn.innerHTML = `<div class="episode-ru">${title}</div><div class="episode-en">${ep.titleEn}</div>`;
                btn.addEventListener('click', () => loadEpisode(ep, btn));
                episodesContainer.appendChild(btn);
            });
        }
        
        if (episodesData.length) {
            const firstEp = episodesData[0];
            const firstBtn = document.querySelector(`.playlist-ep-btn[data-idx="0"]`);
            if (firstBtn) loadEpisode(firstEp, firstBtn);
            else loadEpisode(firstEp, null);
        }
    }
    
    buildPlaylist();
    
    video.addEventListener('error', () => { loadingDiv.style.display = 'none'; });
    video.addEventListener('playing', () => { loadingDiv.style.display = 'none'; });
    video.addEventListener('waiting', () => { if (!video.paused) loadingDiv.style.display = 'flex'; });
    video.addEventListener('canplay', () => { loadingDiv.style.display = 'none'; });
    video.addEventListener('stalled', () => { loadingDiv.style.display = 'flex'; });
</script>
</body>
</html>
