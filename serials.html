<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кинотека</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif; margin: 0; padding: 30px 20px;
            background: linear-gradient(-45deg, #1f0514, #36001a, #16000b); background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        .header-container { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 900px; margin-bottom: 40px; }
        .back-btn {
            background: rgba(255, 255, 255, 0.1); color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2); font-weight: 500; transition: 0.3s; backdrop-filter: blur(10px);
        }
        .back-btn:hover { background: #ff0055; border-color: #ff0055; box-shadow: 0 0 15px rgba(255, 0, 85, 0.5); }
        
        h1 { font-size: 3rem; font-weight: 900; margin: 0; color: #ff0055; text-shadow: 0 4px 15px rgba(255, 0, 85, 0.4); text-transform: uppercase; }

        .container { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 900px; }
        .movie-btn {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; text-decoration: none; padding: 25px; border-radius: 16px; font-size: 1.2rem; font-weight: 700;
            display: flex; justify-content: space-between; align-items: center; transition: 0.3s;
        }
        .movie-btn::after { content: '▶'; font-size: 1rem; color: #ff0055; transition: 0.3s; opacity: 0.5; }
        .movie-btn:hover {
            background: rgba(255, 0, 85, 0.1); border-color: #ff0055; transform: translateX(10px);
        }
        .movie-btn:hover::after { opacity: 1; transform: scale(1.2); }
        
        footer { margin-top: 50px; color: rgba(255,255,255,0.4); font-size: 0.9em; font-weight: 300; }
    </style>
</head>
<body>

    <div class="header-container">
        <a href="index.html" class="back-btn">← Назад</a>
        <h1>СЕРИАЛЫ</h1>
        <div style="width: 85px;"></div>
    </div>

    <div class="container">
        <a href="https://piggyuppy58.github.io/kino/gilligan" class="movie-btn" target="_blank">Вселенная Гиллигана</a>
        <a href="https://piggyuppy58.github.io/kino/dexter" class="movie-btn" target="_blank">Dexter (Декстер)</a>
        <a href="https://piggyuppy58.github.io/kino/theboys" class="movie-btn" target="_blank">The Boys (Пацаны)</a>
        <a href="https://piggyuppy58.github.io/kino/you" class="movie-btn" target="_blank">ТЫ (You)</a>
    </div>

    <footer>Данные взяты из открытых источников</footer>

</body>
</html>
