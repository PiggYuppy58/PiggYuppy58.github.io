<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страница не найдена</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; text-align: center; color: #fff; background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e); background-size: 400% 400%; animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px; padding: 60px 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); max-width: 500px; width: 90%;
        }
        h1 { font-size: 8rem; font-weight: 900; margin: 0; color: #ff0844; line-height: 1; text-shadow: 0 10px 30px rgba(255, 8, 68, 0.4); }
        p { font-size: 1.2rem; margin: 20px 0 40px; font-weight: 300; color: #ccc; }
        .back-btn {
            background: #fff; color: #302b63; text-decoration: none; padding: 15px 35px; border-radius: 50px;
            font-weight: 700; text-transform: uppercase; transition: 0.3s; display: inline-block;
        }
        .back-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div class="glass-panel">
        <h1>404</h1>
        <p>Похоже, вы свернули не туда.<br>Этой страницы не существует.</p>
        <a href="index.html" class="back-btn">На главную</a>
    </div>

</body>
</html>
