    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0a0c12 0%, #12151e 100%);
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            color: #f0f3fa;
            padding: 1.5rem;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #c0252a, #e05a5f);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }
        .header p {
            color: #a0a9c0;
            font-size: 0.9rem;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 1.5rem;
            align-items: start;
        }

        .player-column {
            position: sticky;
            top: 1.5rem;
        }

        .player-section {
            background: #0b0e16;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 12px 28px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .video-wrapper {
            position: relative;
            background: #000;
            width: 100%;
        }
        video {
            width: 100%;
            display: block;
            aspect-ratio: 16 / 9;
            background-color: #000;
            outline: none;
        }
        .episode-info {
            padding: 0.8rem 1.2rem;
            background: #0f121c;
            border-top: 1px solid #232837;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .now-playing {
            font-weight: 600;
            background: #1e243b;
            padding: 0.3rem 0.9rem;
            border-radius: 40px;
            font-size: 0.85rem;
        }
        .now-playing span {
            color: #e05a5f;
            margin-right: 6px;
        }
        .controls-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .quality-badge {
            font-size: 0.7rem;
            background: #2a2f44;
            padding: 0.2rem 0.7rem;
            border-radius: 50px;
        }
        .autoplay-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            background: #1a1e2f;
            padding: 0.2rem 0.8rem 0.2rem 1rem;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
        }
        .autoplay-toggle:hover {
            background: #2a2f44;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #3a3f5e;
            transition: 0.3s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 15px;
            width: 15px;
            left: 3px;
            bottom: 2.5px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #c0252a;
        }
        input:checked + .slider:before {
            transform: translateX(19px);
        }
        .toggle-label {
            font-weight: 500;
        }

        .playlist-column {
            background: rgba(18, 22, 32, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 120px);
            position: sticky;
            top: 1.5rem;
        }
        .playlist-header {
            padding: 1rem 1.2rem;
            background: #0f121c;
            border-bottom: 1px solid #232837;
            font-weight: 700;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .playlist-scroll {
            overflow-y: auto;
            flex: 1;
            padding: 0.5rem 0.8rem 1rem;
        }
        .playlist-season {
            margin-bottom: 1.2rem;
        }
        .playlist-season-title {
            font-size: 0.85rem;
            font-weight: 600;
            background: #1e243b;
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            margin: 0.5rem 0 0.6rem 0;
            letter-spacing: 0.5px;
        }

            background: #b5602c;
        }

            background: #2563eb;
        }

            background: #7c3aed;
        }
        .playlist-episodes {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .playlist-ep-btn {
            background: #1b1f30;
            border: none;
            color: #eef3ff;
            padding: 0.6rem 0.8rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .playlist-ep-btn:hover {
            background: #c0252a;
            transform: translateX(3px);
        }
        .playlist-ep-btn.active-ep {
            background: #c0252a;
            box-shadow: 0 0 0 1px #ff9f9f;
            font-weight: bold;
        }
        .episode-ru {
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.2;
        }
        .episode-en {
            font-size: 0.65rem;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .loading-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            backdrop-filter: blur(6px);
            z-index: 10;
            border-radius: 20px;
        }
        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #5a637c;
        }

            body {
                padding: 1rem;
            }
            .main-layout {

                gap: 1rem;

                position: relative;
                top: 0;
            }
            .playlist-column {
                position: relative;
                top: 0;
                max-height: 500px;
            }
        }

    function loadEpisode(episode, btnElement) {
        if (!episode || !episode.url) return;
        loadingDiv.style.display = 'flex';
        if (hls) {
            hls.destroy();
            hls = null;
        }
        if (currentActiveBtn) {
            currentActiveBtn.classList.remove('active-ep');
        }
        if (btnElement) {
            btnElement.classList.add('active-ep');
            currentActiveBtn = btnElement;
        }
        const foundIndex = episodesData.findIndex(e => e.url === episode.url);
        if (foundIndex !== -1) currentEpisodeIndex = foundIndex;
        let showPrefix = "";
        if (episode.season === 0) showPrefix = "Первородный грех — ";
        else if (episode.season === 9) showPrefix = "Новая кровь — ";
        else if (episode.season === 10) showPrefix = "Воскрешение — ";
        else showPrefix = `${episode.season} сезон — `;
        currentLabelSpan.innerText = `${showPrefix}${episode.titleRu} (${episode.episode} серия)`;
        const url = episode.url;
        if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            const onLoaded = () => {
                loadingDiv.style.display = 'none';
                video.play().catch(e => console.warn("autoplay blocked", e));
                video.removeEventListener('loadedmetadata', onLoaded);
            };
            video.addEventListener('loadedmetadata', onLoaded, { once: true });
            video.addEventListener('error', () => {
                loadingDiv.style.display = 'none';
                currentLabelSpan.innerText = `${showPrefix}${episode.titleRu} (${episode.episode} серия) (ошибка)`;
            }, { once: true });
            video.load();
        } else if (Hls.isSupported()) {
            hls = new Hls({ debug: false, enableWorker: true, lowLatencyMode: false });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                loadingDiv.style.display = 'none';
                video.play().catch(e => console.log("автоплей заблокирован", e));
            });
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    loadingDiv.style.display = 'none';
                    currentLabelSpan.innerText = `${showPrefix}${episode.titleRu} (${episode.episode} серия) (ошибка потока)`;
                } else {
                    loadingDiv.style.display = 'none';
                }
            });
        } else {
            loadingDiv.style.display = 'none';
            alert("Ваш браузер не поддерживает HLS.");
            currentLabelSpan.innerText = `${showPrefix}${episode.titleRu} (${episode.episode} серия) (не поддерживается)`;
        }
        setTimeout(() => {
            if (loadingDiv.style.display === 'flex') {
                loadingDiv.style.display = 'none';
                if (currentLabelSpan.innerText.includes(episode.titleRu))
                    currentLabelSpan.innerText = `${showPrefix}${episode.titleRu} (${episode.episode} серия) (долгая загрузка)`;
            }
        }, 12000);
    }

    function playNextEpisode() {
        if (!autoplayEnabled) return;
        if (currentEpisodeIndex === null) return;
        const nextIndex = currentEpisodeIndex + 1;
        if (nextIndex >= episodesData.length) {
            console.log("Конец всей вселенной Декстера.");
            return;
        }
        const nextEpisode = episodesData[nextIndex];
        const nextButton = document.querySelector(`.playlist-ep-btn[data-season="${nextEpisode.season}"][data-episode="${nextEpisode.episode}"]`);
        if (nextButton) {
            loadEpisode(nextEpisode, nextButton);
        } else {
            loadEpisode(nextEpisode, null);
        }
    }

    video.addEventListener('ended', () => { playNextEpisode(); });
    autoplayCheckbox.addEventListener('change', (e) => { autoplayEnabled = e.target.checked; });

    function buildPlaylist() {
        const groups = new Map();
        episodesData.forEach(ep => {
            const key = ep.season;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(ep);
        });
        const sortedKeys = Array.from(groups.keys()).sort((a,b) => a-b);
        for (let season of sortedKeys) {
            const eps = groups.get(season);
            const seasonTitle = eps[0].seasonName;
            let seasonClass = "";
            if (season === 0) seasonClass = "prequel";
            else if (season === 9) seasonClass = "newblood";
            else if (season === 10) seasonClass = "resurrection";
            const seasonDiv = document.createElement('div');
            seasonDiv.className = `playlist-season ${seasonClass}`;
            seasonDiv.innerHTML = `<div class="playlist-season-title">${seasonTitle}</div><div class="playlist-episodes" id="playlist-season-${season}"></div>`;
            playlistContainer.appendChild(seasonDiv);
            const episodesContainer = seasonDiv.querySelector('.playlist-episodes');
            eps.forEach(ep => {
                const btn = document.createElement('button');
                btn.className = 'playlist-ep-btn';
                btn.setAttribute('data-season', ep.season);
                btn.setAttribute('data-episode', ep.episode);
                btn.innerHTML = `<div class="episode-ru">${ep.titleRu} (${ep.episode} серия)</div><div class="episode-en">${ep.titleEn}</div>`;
                btn.addEventListener('click', () => loadEpisode(ep, btn));
                episodesContainer.appendChild(btn);
            });
        }
        if (episodesData.length) {
            const firstEp = episodesData[0];
            const firstBtn = document.querySelector(`.playlist-ep-btn[data-season="${firstEp.season}"][data-episode="${firstEp.episode}"]`);
            if (firstBtn) loadEpisode(firstEp, firstBtn);
            else loadEpisode(firstEp, null);
        }
    }

    buildPlaylist();

    video.addEventListener('error', () => { loadingDiv.style.display = 'none'; });
    video.addEventListener('playing', () => { loadingDiv.style.display = 'none'; });
    video.addEventListener('waiting', () => { if (!video.paused) loadingDiv.style.display = 'flex'; });
    video.addEventListener('canplay', () => { loadingDiv.style.display = 'none'; });
</script>
</body>
</html>
