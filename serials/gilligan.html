<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Киновселенная Винса Гиллигана</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, h1, p, a, div {
            margin: 0;
            padding: 0;
            text-decoration: none;
            color: inherit;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #121212; /* Глубокий черный */
            color: #f0f0f0; /* Почти белый */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 70px;
            width: 100%;
            max-width: 1200px;
        }
        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            color: #097969; /* Зеленый в стиле BB */
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .header p {
            font-size: 1.2rem;
            color: #888;
        }
        .main-container {
            width: 100%;
            max-width: 1200px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 колонки */
            gap: 50px; /* Большие отступы */
        }
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr; /* 1 колонка на мобильных */
                gap: 30px;
            }
        }
        .grid-item {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a; /* Темно-серый для карточки */
            border-radius: 20px;
            height: 300px; /* Фиксированная высота */
            overflow: hidden;
            box-shadow: 0 10px 15px rgba(0,0,0,0.5);
            transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease, background-color 0.4s ease;
            border: 2px solid transparent; /* Для эффекта наведения */
            padding: 20px;
        }
        .grid-item:hover {
            transform: translateY(-10px) scale(1.02);
            background-color: #222;
        }
        /* Специфические свечения при наведении */
        .bb-card:hover {
            box-shadow: 0 20px 40px rgba(9, 121, 105, 0.6);
            border-color: rgba(9, 121, 105, 0.4);
        }
        .bcs-card:hover {
            box-shadow: 0 20px 40px rgba(226, 182, 57, 0.6);
            border-color: rgba(226, 182, 57, 0.4);
        }
        .elcamino-card:hover {
            box-shadow: 0 20px 40px rgba(229, 9, 20, 0.6);
            border-color: rgba(229, 9, 20, 0.4);
        }
        .pluribus-card:hover {
            box-shadow: 0 20px 40px rgba(160, 160, 160, 0.6);
            border-color: rgba(160, 160, 160, 0.4);
        }
        /* Центрирование и масштабирование содержимого */
        .card-content {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        .card-content img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }
        /* Специфический макет для El Camino (воссоздание стиля Netflix) */
        .elcamino-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .netflix-n {
            color: #e50914;
            font-family: 'Arial Black', sans-serif; /* Для лучшего соответствия шрифта N */
            font-size: 1.5rem;
            margin-bottom: -5px; /* Сблизить с рамкой */
            display: inline-block;
        }
        .netflix-frame {
            border: 2px solid rgba(229, 9, 20, 0.6); /* Более тонкая красная рамка */
            padding: 15px 30px;
            margin-top: -5px;
        }
        .elcamino-logo-img {
            max-height: 40px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Киновселенная Винса Гиллигана</h1>
        <p>Лучшие сериалы и фильмы в одном премиальном каталоге</p>
    </div>
    <div class="main-container">
        <main class="grid-container">
            <a href="https://piggyuppy58.github.io/kino/gilligan/breakingbad.html" class="grid-item bb-card">
                <div class="card-content">
                    <img src="https://piggyuppy58.github.io/kino/gilligan/breakingbad.png" alt="Breaking Bad">
                </div>
            </a>
            <a href="https://piggyuppy58.github.io/kino/gilligan/bettercallsaul.html" class="grid-item bcs-card">
                <div class="card-content">
                    <img src="https://piggyuppy58.github.io/kino/gilligan/bettercallsaul.png" alt="Better Call Saul">
                </div>
            </a>
            <a href="https://piggyuppy58.github.io/kino/gilligan/elcamino.m3u8" class="grid-item elcamino-card">
                <div class="card-content">
                    <img src="https://piggyuppy58.github.io/kino/gilligan/elcamino.png" alt="El Camino" class="elcamino-logo-img">
                        </div>
            </a>
            <a href="https://piggyuppy58.github.io/kino/gilligan/404.html" class="grid-item pluribus-card">
                <div class="card-content">
                    <img src="https://piggyuppy58.github.io/kino/gilligan/plur1bus.png" alt="Pluribus">
                </div>
            </a>
        </main>
    </div>
</body>
</html>
