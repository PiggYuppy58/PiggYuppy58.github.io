<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Портал</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif; margin: 0; padding: 40px 20px;
            min-height: 100vh; color: #fff; display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #0f0c29);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        h1 {
            font-size: 4rem; font-weight: 900; margin-bottom: 60px; text-align: center; letter-spacing: 2px;
            background: linear-gradient(to right, #00e5ff, #b2ff05);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0, 229, 255, 0.3);
        }
        .main-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; width: 100%; max-width: 1100px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 40px 30px;
            text-align: center; text-decoration: none; color: white; display: flex; flex-direction: column; justify-content: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .glass-card:hover {
            transform: translateY(-10px); background: rgba(255, 255, 255, 0.1);
            border-color: rgba(0, 229, 255, 0.5); box-shadow: 0 15px 40px rgba(0, 229, 255, 0.2);
        }
        .card-icon { font-size: 4rem; margin-bottom: 20px; }
        .card-title { font-size: 2rem; font-weight: 700; margin-bottom: 10px; }
        .card-desc { font-size: 1.1rem; color: #b3b3cc; margin-bottom: 30px; font-weight: 300; }
        .action-btn {
            background: rgba(0, 229, 255, 0.1); color: #00e5ff; padding: 12px 30px; border-radius: 50px; font-weight: 700;
            border: 1px solid #00e5ff; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .glass-card:hover .action-btn { background: #00e5ff; color: #0f0c29; box-shadow: 0 0 20px rgba(0, 229, 255, 0.6); }
    </style>
</head>
<body>

    <h1>МОЙ ПОРТАЛ</h1>
    
    <div class="main-grid">
        <a href="games.html" class="glass-card">
            <div class="card-icon">🎮</div>
            <div class="card-title">ИГРЫ</div>
            <div class="card-desc">Топовые хиты, аркады и хорроры</div>
            <div><span class="action-btn">Перейти</span></div>
        </a>

        <a href="serials.html" class="glass-card">
            <div class="card-icon">🍿</div>
            <div class="card-title">КИНОТЕКА</div>
            <div class="card-desc">Отборные сериалы без подписок</div>
            <div><span class="action-btn">Смотреть</span></div>
        </a>

        <a href="https://piggy-vpn.github.io/" target="_blank" class="glass-card">
            <div class="card-icon">🚀</div>
            <div class="card-title">VPN</div>
            <div class="card-desc">Свободный доступ к интернету</div>
            <div><span class="action-btn">Приобрести</span></div>
        </a>
    </div>

</body>
</html>
