<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Технические работы</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; text-align: center; color: #fff; background: linear-gradient(-45deg, #141e30, #243b55); background-size: 400% 400%; animation: gradientBG 15s ease infinite; padding: 20px;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px; padding: 50px 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); max-width: 500px; width: 100%; box-sizing: border-box;
        }
        .pulse-ring {
            width: 80px; height: 80px; border-radius: 50%; border: 3px solid transparent; border-top-color: #00e5ff; border-right-color: #00e5ff;
            animation: spin 1s linear infinite; margin: 0 auto 30px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { font-size: 2rem; font-weight: 700; margin: 0 0 15px 0; letter-spacing: 1px; color: #00e5ff; }
        p { font-size: 1.1rem; color: #bbb; line-height: 1.6; font-weight: 300; margin: 0; }
    </style>
</head>
<body>

    <div class="glass-panel">
        <div class="pulse-ring"></div>
        <h1>МЫ ОБНОВЛЯЕМСЯ</h1>
        <p>Сервер временно недоступен в связи с техническими работами. Мы скоро вернемся с новыми фичами!</p>
    </div>

</body>
</html>
